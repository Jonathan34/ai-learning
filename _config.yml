title: AI & Agentic Systems — Learning Path
description: From experienced software engineer to credible AI architect. A structured curriculum for senior engineers.

theme: just-the-docs

url: "https://jonathan34.github.io"
baseurl: "/ai-learning"

plugins:
  - jekyll-remote-theme

# Navigation structure
nav_enabled: true

# Search
search_enabled: true
search.heading_level: 3

# Footer
footer_content: "Built by Jonathan Delfour. Content evolves — check back."

# Exclude non-docs files
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore

# Color scheme
color_scheme: dark

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Mermaid diagrams
mermaid:
  version: "11"

# Heading anchor links
heading_anchors: true

# Previous/Next page navigation
nav_next_prev: true
